                                                                    const satMemoStr = satMemoObj.plan || '';
                                                                    
                                                                    const sunMemoObj = data[sunKey] && data[sunKey]['sun_memo'] ? data[sunKey]['sun_memo'] : {};
                                                                    const sunMemoStr = sunMemoObj.plan || '';
                                                                    
                                                                    const sunMonth = sunDate.getMonth() + 1;
                                                                    const sunDay = sunDate.getDate();
                                                                    const sunLabel = "日曜 (" + sunMonth + "/" + sunDay + ")";

                                                                    return (
                                                                        <div key={i} className="row-span-6 border-b border-r border-gray-200 bg-gray-50 flex flex-col print:border-black print-row h-full print:h-auto print:overflow-visible">
                                                                            <div 
                                                                                className="flex-1 flex flex-col p-2 border-b border-gray-200 cursor-pointer hover:bg-blue-50 transition-colors print:overflow-visible"
                                                                                onClick={() => setModal({ isOpen: true, date: satKey, slotId: 'sat_memo' })}
                                                                            >
                                                                                <div className="text-xs font-bold text-blue-700 mb-1">土曜メモ</div>
                                                                                <div className="flex-1 overflow-hidden print:overflow-visible text-[10px] sm:text-[10px] text-gray-700 whitespace-pre-wrap">{satMemoStr}</div>
                                                                            </div>
                                                                            <div 
                                                                                className="flex-1 flex flex-col p-2 cursor-pointer hover:bg-red-50 transition-colors print:overflow-visible"
                                                                                onClick={() => setModal({ isOpen: true, date: sunKey, slotId: 'sun_memo' })}
                                                                            >
                                                                                <div className="text-xs font-bold text-red-600 mb-1">{sunLabel}</div>
                                                                                <div className="flex-1 overflow-hidden print:overflow-visible text-[10px] sm:text-[10px] text-gray-700 whitespace-pre-wrap">{sunMemoStr}</div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (['5', '6', '7', 'after', 'memo'].includes(slot.id)) {
                                                                    return null;
                                                                }
                                                            }
                                                            return (
                                                                <SlotCell key={i} dateKey={formatDateKey(d)} slot={slot} />
                                                            );
                                                        })}
                                                    </React.Fragment>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}
                            {view === 'month' && <MonthView date={date} data={data} onNav={d=>{setDate(d);setView('week');}} classes={classes} />}
                            
                            {view === 'events' && (
                                <div className="h-full p-4 flex flex-col">
                                    <div className="bg-white rounded-lg shadow border flex-1 flex flex-col overflow-hidden">
                                        <div className="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                                            <h2 className="text-lg font-bold flex items-center gap-2"><Icons.FileText /> 行事予定表</h2>
                                            {eventUrl && (
                                                <button 
                                                    onClick={() => { setEventUrl(''); if(isCloudLoaded) saveCloud(data, classes, title, '', studentsData, homeroomClass, slotHeights); }} 
                                                    className="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded font-bold hover:bg-red-200 transition-colors"
                                                >
                                                    URLを解除
                                                </button>
                                            )}
                                        </div>
                                        <div className="flex-1 bg-gray-200 relative">
                                            {eventUrl ? (
                                                <iframe src={eventUrl} className="w-full h-full border-0" title="Event Schedule"></iframe>
                                            ) : (
                                                <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-600 p-6 text-center overflow-y-auto custom-scrollbar">
                                                    <Icons.FileText size={64} className="mb-4 opacity-30" />
                                                    <h3 className="text-lg font-bold mb-2">行事予定表（PDF等）のリンクを設定</h3>
                                                    <p className="text-sm mb-6 max-w-md">
                                                        複数端末で予定表を同期して確認できるように、<br/>
                                                        学校HPのリンクや、<b>GoogleドライブにアップロードしたPDFの共有リンク</b>を貼り付けてください。
                                                    </p>
                                                    <div className="flex w-full max-w-lg gap-2 mb-6">
                                                        <input 
                                                            type="url" 
                                                            placeholder="https://drive.google.com/file/d/..." 
                                                            className="flex-1 border p-2 rounded shadow-sm"
                                                            id="eventUrlInput"
                                                        />
                                                        <button 
                                                            onClick={() => {
                                                                const val = document.getElementById('eventUrlInput').value;
                                                                if(val) {
                                                                    let finalUrl = val;
                                                                    if (finalUrl.includes('drive.google.com/file/d/')) {
                                                                        finalUrl = finalUrl.replace('/view?usp=sharing', '/preview').replace('/view', '/preview');
                                                                    }
                                                                    setEventUrl(finalUrl);
                                                                    if (isCloudLoaded) saveCloud(data, classes, title, finalUrl, studentsData, homeroomClass, slotHeights);
                                                                }
                                                            }}
                                                            className="bg-blue-600 text-white font-bold px-4 py-2 rounded shadow hover:bg-blue-700 whitespace-nowrap transition-colors"
                                                        >
                                                            保存して表示
                                                        </button>
                                                    </div>
                                                    <div className="text-xs text-gray-500 text-left bg-white p-4 rounded shadow-sm border border-gray-200 max-w-lg w-full">
                                                        <p className="font-bold text-gray-700 mb-1">【GoogleドライブのPDFを貼る場合の手順】</p>
                                                        <ol className="list-decimal pl-4 space-y-1">
                                                            <li>予定表のPDFをGoogleドライブに保存する</li>
                                                            <li>ファイルを右クリック ＞ 「共有」</li>
                                                            <li>一般的なアクセスを「<b>リンクを知っている全員</b>」に変更</li>
                                                            <li>「リンクをコピー」して、上の枠に貼り付ける</li>
                                                        </ol>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'history' && <div className="h-full p-4"><ClassHistoryView data={data} classes={classes} studentsData={studentsData} /></div>}
                            {view === 'stats' && <div className="h-full p-4"><StatsView data={data} classes={classes} date={date} /></div>}
                        </div>
                    </main>

                    <SlotModal isOpen={modal.isOpen} onClose={()=>setModal({...modal, isOpen:false})} date={modal.date} slotId={modal.slotId} data={(data[modal.date]||{})[modal.slotId]} onSave={handleSaveSlot} classOptions={classes} studentsData={studentsData} homeroomClass={homeroomClass} />
                    <SettingsModal isOpen={isSettingsOpen} onClose={()=>setSettingsOpen(false)} classes={classes} onUpdateClasses={c=>{setClasses(c); if(isCloudLoaded)saveCloud(data,c,title,eventUrl,studentsData,homeroomClass,slotHeights);}} syncId={syncId} onUpdateSyncId={setSyncId} appId={appId} onUpdateAppId={setAppId} onTriggerSync={triggerSync} isSyncing={isSyncing} title={title} onUpdateTitle={t=>{setTitle(t); if(isCloudLoaded)saveCloud(data,classes,t,eventUrl,studentsData,homeroomClass,slotHeights);}} onResetData={handleResetData} onUpdateStudents={s=>{setStudentsData(s); if(isCloudLoaded)saveCloud(data,classes,title,eventUrl,s,homeroomClass,slotHeights);}} studentsData={studentsData} homeroomClass={homeroomClass} onUpdateHomeroomClass={h=>{setHomeroomClass(h); if(isCloudLoaded)saveCloud(data,classes,title,eventUrl,studentsData,h,slotHeights);}} onResetHeights={handleResetHeights} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
