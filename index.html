<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Log Pro</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f3f4f6; overscroll-behavior-y: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-row { page-break-inside: avoid; }
            .h-screen { height: auto !important; }
            .overflow-hidden { overflow: visible !important; }
            .overflow-auto { overflow: visible !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Setup
        const defaultFirebaseConfig = { apiKey: "", authDomain: "", projectId: "" };
        let db = null;
        let auth = null;
        
        const savedConfigStr = localStorage.getItem('teacherLogFirebaseConfig');
        let activeConfig = defaultFirebaseConfig;
        if (savedConfigStr) { try { activeConfig = JSON.parse(savedConfigStr); } catch (e) {} }

        const savedAppId = localStorage.getItem('teacherLogAppId');
        const initialAppId = savedAppId || (typeof __app_id !== 'undefined' ? __app_id : 'teachers-log-pro');
        const useCloud = activeConfig.apiKey !== undefined && activeConfig.apiKey !== "";

        if (useCloud) {
            try {
                if (!firebase.apps.length) firebase.initializeApp(activeConfig);
                db = firebase.firestore();
                db.settings({ experimentalForceLongPolling: true });
                auth = firebase.auth();
            } catch (e) { console.error("Firebase init error:", e); }
        }

        const { useState, useEffect, useMemo, useCallback, Component } = React;
        const APP_VERSION = "6.2.0"; // 行事予定表タブ・PDFリンク表示機能追加版

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-red-50 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded shadow-xl text-center border border-red-200">
                                <h1 className="text-xl font-bold text-red-700 mb-2">エラーが発生しました</h1>
                                <p className="text-gray-600 mb-4">{this.state.error?.message || "予期せぬエラーが発生しました"}</p>
                                <button onClick={() => window.location.reload()} className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">アプリを再読み込み</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const WEEK_DAYS = ['月', '火', '水', '木', '金', '土'];
        const COLOR_PALETTE = {
            red: { bg: 'bg-red-500', bgLight: 'bg-red-100', text: 'text-red-800', border: 'border-red-600', ring: 'ring-red-500' },
            orange: { bg: 'bg-orange-500', bgLight: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-600', ring: 'ring-orange-500' },
            yellow: { bg: 'bg-yellow-400', bgLight: 'bg-yellow-100', text: 'text-yellow-800', border: 'border-yellow-500', ring: 'ring-yellow-400' },
            green: { bg: 'bg-green-500', bgLight: 'bg-green-100', text: 'text-green-800', border: 'border-green-600', ring: 'ring-green-500' },
            blue: { bg: 'bg-blue-500', bgLight: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-600', ring: 'ring-blue-500' },
            indigo: { bg: 'bg-indigo-500', bgLight: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-600', ring: 'ring-indigo-500' },
            gray: { bg: 'bg-gray-500', bgLight: 'bg-gray-100', text: 'text-gray-800', border: 'border-gray-600', ring: 'ring-gray-500' }
        };

        const DEFAULT_CLASSES = [
            { name: '1A', color: 'red' }, { name: '1B', color: 'red' },
            { name: '2A', color: 'green' }, { name: '2B', color: 'green' }, 
            { name: '3A', color: 'blue' }, { name: '3B', color: 'blue' },   
            { name: '道徳', color: 'yellow' }, { name: '総学', color: 'orange' },
            { name: 'HR', color: 'indigo' }, { name: '監督', color: 'gray' }
        ];

        const TIME_SLOTS = [
            { id: 'todo', label: 'Todo', type: 'memo', height: 'h-16' },       
            { id: 'collection', label: '回収物', type: 'memo', height: 'h-16' }, 
            { id: 'morning', label: '朝・行事', type: 'special', height: 'h-20' },
            { id: '1', label: '1限', type: 'class', height: 'h-24' },
            { id: '2', label: '2限', type: 'class', height: 'h-24' },
            { id: '3', label: '3限', type: 'class', height: 'h-24' },
            { id: '4', label: '4限', type: 'class', height: 'h-24' },
            { id: 'lunch', label: '昼休み', type: 'break', height: 'h-8' },
            { id: '5', label: '5限', type: 'class', height: 'h-24' },
            { id: '6', label: '6限', type: 'class', height: 'h-24' },
            { id: '7', label: '7限', type: 'class', height: 'h-24' },
            { id: 'after', label: '帰りHR', type: 'special', height: 'h-14' },
            { id: 'memo', label: 'メモ', type: 'memo', height: 'h-20' }
        ];

        const getMonday = (d) => {
            const nd = new Date(d);
            const day = nd.getDay();
            const diff = nd.getDate() - day + (day === 0 ? -6 : 1); 
            return new Date(nd.setDate(diff));
        };

        const guessColor = (name) => {
            if (!name) return 'gray';
            if (name.startsWith('1')) return 'red';
            if (name.startsWith('2')) return 'green';
            if (name.startsWith('3')) return 'blue'; 
            if (name.includes('道徳')) return 'yellow';
            if (name.includes('HR')) return 'indigo';
            return 'gray';
        };

        const formatDateKey = (date) => {
            const d = new Date(date);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };

        const generateId = () => Math.random().toString(36).substring(2, 10).toUpperCase();

        const Icons = {
            ChevronLeft: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>,
            Calendar: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            List: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>,
            Settings: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Download: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Upload: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            X: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            BarChart: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>,
            Cloud: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19"/><path d="M20 16.952c1.235-.976 2-2.528 2-4.162 0-2.761-2.238-5-5-5-.403 0-.792.051-1.168.146C15.394 5.378 13.068 4 10.5 4 6.91 4 4 6.91 4 10.5c0 1.637.595 3.125 1.583 4.29"/></svg>,
            Trash: ({size=16, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Wifi: ({size=16, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
            Database: ({size=16, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
            Printer: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            Search: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            FileText: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        };

        // --- Views & Modals ---

        const ClassSelector = ({ selectedClass, onSelect, classes }) => {
            return (
                <div className="flex flex-wrap gap-2">
                    {classes.map((c, idx) => {
                        const isSel = selectedClass === c.name;
                        const t = COLOR_PALETTE[c.color || 'gray'];
                        const cls = isSel ? (t.bg + " text-white " + t.border + " ring-2 ring-offset-1 " + t.ring + " scale-105") : (t.bgLight + " " + t.text + " border-gray-200 opacity-80 hover:opacity-100 hover:scale-105");
                        return (
                            <button key={idx} onClick={() => onSelect(c.name)} className={"px-3 py-2 rounded-lg text-sm font-bold border transition-all shadow-sm " + cls}>
                                {c.name}
                            </button>
                        );
                    })}
                </div>
            );
        };

        const SlotModal = ({ isOpen, onClose, date, slotId, data, onSave, classOptions }) => {
            if (!isOpen) return null;
            const slotDef = TIME_SLOTS.find(s => s.id === slotId);
            const isClass = slotDef?.type === 'class';
            const [localData, setLocalData] = useState(data || { plan: '', actual: '', classId: '', memo: '' });

            useEffect(() => { setLocalData(data || { plan: '', actual: '', classId: '', memo: '' }); }, [data, isOpen]);

            const dStr = new Date(date).toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'long' });

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 md:p-6">
                    <div className="bg-white rounded-xl w-full max-w-2xl shadow-2xl flex flex-col h-[90vh]">
                        <div className="p-4 border-b bg-gray-800 text-white flex justify-between items-center shrink-0 rounded-t-xl">
                            <div><h2 className="text-lg font-bold">{dStr}</h2><span className="text-sm bg-gray-700 px-2 py-0.5 rounded">{slotDef?.label}</span></div>
                            <button onClick={onClose} className="p-2 hover:bg-gray-700 rounded-full transition-colors"><Icons.X /></button>
                        </div>
                        
                        <div className="p-5 overflow-y-auto flex-1 flex flex-col gap-4 custom-scrollbar">
                            {isClass && (
                                <div className="shrink-0">
                                    <label className="block text-xs font-bold text-gray-500 mb-2">クラス</label>
                                    <ClassSelector selectedClass={localData.classId} onSelect={c => setLocalData({...localData, classId: c===localData.classId?'':c})} classes={classOptions} />
                                </div>
                            )}
                            
                            <div className="flex-1 flex flex-col space-y-2 min-h-[150px]">
                                <label className="block text-sm font-bold text-gray-700 shrink-0">{isClass ? '予定' : '内容'}</label>
                                <textarea className="w-full border-2 border-gray-200 rounded-lg p-3 flex-1 resize-none focus:ring-2 focus:ring-blue-500" value={localData.plan || ''} onChange={e => setLocalData({...localData, plan: e.target.value})} placeholder="入力してください..." />
                            </div>
                            
                            {isClass && (
                                <div className="flex-1 flex flex-col space-y-2 min-h-[150px]">
                                    <label className="block text-sm font-bold text-gray-700 shrink-0">実施記録・振り返り</label>
                                    <textarea className="w-full border-2 border-yellow-100 bg-yellow-50 rounded-lg p-3 flex-1 resize-none focus:ring-2 focus:ring-yellow-400" value={localData.actual || ''} onChange={e => setLocalData({...localData, actual: e.target.value})} placeholder="実施した内容や振り返りを入力してください..." />
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t bg-gray-50 flex justify-end gap-3 shrink-0 rounded-b-xl">
                            <button onClick={onClose} className="px-5 py-2.5 rounded-lg text-gray-600 hover:bg-gray-200 font-bold transition-colors">キャンセル</button>
                            <button onClick={() => { onSave(date, slotId, localData); onClose(); }} className="px-8 py-2.5 rounded-lg bg-blue-600 text-white font-bold shadow-md hover:bg-blue-700 transition-colors">保存する</button>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, classes, onUpdateClasses, syncId, onUpdateSyncId, appId, onUpdateAppId, onTriggerSync, isSyncing, title, onUpdateTitle, onResetData }) => {
            if (!isOpen) return null;
            const [lClasses, setLClasses] = useState([...classes]);
            const [lSyncId, setLSyncId] = useState(syncId);
            const [lAppId, setLAppId] = useState(appId);
            const [lTitle, setLTitle] = useState(title);
            const [configIn, setConfigIn] = useState('');

            const handleSave = () => {
                onUpdateClasses(lClasses.filter(c => c.name.trim() !== ''));
                onUpdateSyncId(lSyncId); onUpdateAppId(lAppId); onUpdateTitle(lTitle);
                onClose();
            };

            const parseConfig = () => {
                if (!configIn.trim()) return;
                try {
                    const ex = (k, t) => { const m = t.match(new RegExp(k + "\\s*:\\s*[\"']([^\"]+)[\"']")); return m ? m[1] : null; };
                    const apiKey = ex('apiKey', configIn);
                    if (apiKey) {
                        localStorage.setItem('teacherLogFirebaseConfig', JSON.stringify({ apiKey, projectId: ex('projectId', configIn), authDomain: ex('authDomain', configIn) }));
                        if (confirm("設定を保存しました。リロードしますか？")) window.location.reload();
                    }
                } catch (e) { alert("解析エラー"); }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] flex flex-col">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2 shrink-0"><Icons.Settings/>設定</h2>
                        <div className="flex-1 overflow-y-auto space-y-6 custom-scrollbar pr-2">
                            <div>
                                <label className="block text-sm font-bold mb-1">担任名</label>
                                <input type="text" className="w-full border p-2 rounded" value={lTitle || ''} onChange={e => setLTitle(e.target.value)} />
                            </div>
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-3">
                                <h3 className="font-bold text-blue-800 flex items-center gap-1"><Icons.Cloud size={16}/> クラウド同期</h3>
                                <div className="flex items-center gap-2"><label className="w-16 text-xs">App ID:</label><input className="flex-1 border p-1 rounded font-mono text-sm" value={lAppId || ''} onChange={e=>setLAppId(e.target.value)}/></div>
                                <div className="flex items-center gap-2"><label className="w-16 text-xs">Sync ID:</label><input className="flex-1 border p-1 rounded font-mono text-sm font-bold" value={lSyncId || ''} onChange={e=>setLSyncId(e.target.value)}/></div>
                                <button onClick={() => onTriggerSync(lSyncId, lAppId)} disabled={isSyncing} className="w-full bg-green-600 text-white font-bold py-2 rounded flex justify-center items-center gap-1 hover:bg-green-700 disabled:bg-gray-400"><Icons.Wifi size={16}/>同期</button>
                            </div>
                            <div className="bg-gray-100 p-4 rounded-lg border border-gray-200 space-y-2">
                                <h3 className="font-bold text-gray-700 flex items-center gap-1"><Icons.Database size={16}/> Firebase</h3>
                                <textarea className="w-full border rounded p-2 text-xs font-mono h-16" placeholder="const config = {...}" value={configIn} onChange={e=>setConfigIn(e.target.value)} />
                                <button onClick={parseConfig} className="w-full bg-gray-600 text-white text-xs py-1 rounded">更新してリロード</button>
                            </div>
                            <div className="space-y-2">
                                <div className="flex justify-between items-center"><label className="font-bold text-sm">クラス設定</label><button onClick={() => setLClasses([...lClasses, {name:'', color:'gray'}])} className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">+ 追加</button></div>
                                {lClasses.map((c, i) => (
                                    <div key={i} className="flex gap-2">
                                        <input className="border p-1 rounded flex-1" value={c.name} onChange={e => { const nc=[...lClasses]; nc[i].name=e.target.value; setLClasses(nc); }} />
                                        <select className={"border p-1 rounded w-20 " + (COLOR_PALETTE[c.color]?.bgLight || "")} value={c.color} onChange={e => { const nc=[...lClasses]; nc[i].color=e.target.value; setLClasses(nc); }}>
                                            {Object.keys(COLOR_PALETTE).map(k => <option key={k} value={k}>{COLOR_PALETTE[k].label}</option>)}
                                        </select>
                                        <button onClick={() => setLClasses(lClasses.filter((_,idx)=>idx!==i))} className="text-gray-400 hover:text-red-500"><Icons.Trash/></button>
                                    </div>
                                ))}
                            </div>

                            {/* データリセット（年度更新）エリア */}
                            <div className="bg-red-50 p-4 rounded-lg border border-red-200 space-y-2 mt-6">
                                <h3 className="font-bold text-red-800 flex items-center gap-1"><Icons.Trash size={16}/> 年度更新・データリセット</h3>
                                <p className="text-xs text-red-700 font-medium">※すべての予定と実施記録を完全に消去します。<br/>（クラス設定や担任名はそのまま残ります）</p>
                                <button onClick={() => { onClose(); onResetData(); }} className="w-full bg-red-600 text-white font-bold py-2 rounded hover:bg-red-700 transition shadow-sm">
                                    すべての記録を消去する
                                </button>
                            </div>
                        </div>
                        <div className="flex justify-end gap-2 mt-4 pt-4 border-t shrink-0">
                            <button onClick={onClose} className="px-4 py-2 bg-gray-200 rounded font-bold">キャンセル</button>
                            <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded font-bold">保存</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MonthView = ({ date, data, onNav, classes }) => {
            const y = date.getFullYear(), m = date.getMonth();
            const first = new Date(y, m, 1).getDay();
            const diff = first === 0 ? 6 : first - 1;
            const days = new Date(y, m + 1, 0).getDate();
            const grid = [];
            let dCount = 1;
            
            for (let i = 0; i < 6; i++) {
                const row = [];
                for (let j = 0; j < 7; j++) {
                    if (i === 0 && j < diff) row.push(null);
                    else if (dCount > days) row.push(null);
                    else { row.push(new Date(y, m, dCount)); dCount++; }
                }
                grid.push(row);
                if (dCount > days) break;
            }

            return (
                <div className="h-full p-4 overflow-hidden flex flex-col">
                    <div className="bg-white rounded-lg shadow border flex-1 flex flex-col">
                        <div className="grid grid-cols-7 border-b bg-gray-50">
                            {WEEK_DAYS.concat(['日']).map((d, i) => (
                                <div key={i} className={"p-2 text-center text-sm font-bold " + (i===6?"text-red-500":"text-gray-600")}>{d}</div>
                            ))}
                        </div>
                        <div className="flex-1 grid grid-rows-5 sm:grid-rows-6">
                            {grid.map((row, r) => (
                                <div key={r} className="grid grid-cols-7">
                                    {row.map((dt, c) => {
                                        if (!dt) return <div key={c} className="bg-gray-50/50 border-r border-b"></div>;
                                        const dk = formatDateKey(dt);
                                        const dData = data[dk] || {};
                                        const isToday = formatDateKey(new Date()) === dk;
                                        const dcs = [];
                                        ['1','2','3','4','5','6','7'].forEach(p => { if (dData[p]?.classId) dcs.push({p, id: dData[p].classId}); });

                                        return (
                                            <div key={c} onClick={() => onNav(dt)} className={"border-r border-b p-1 cursor-pointer hover:bg-blue-50 flex flex-col " + (isToday ? "bg-blue-50" : "")}>
                                                <div className="mb-1"><span className={"text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full " + (isToday ? "bg-blue-600 text-white" : "")}>{dt.getDate()}</span></div>
                                                <div className="flex-1 flex flex-wrap gap-1 content-start overflow-hidden">
                                                    {dcs.map((x, i) => {
                                                        const co = classes.find(cl => cl.name === x.id);
                                                        const th = COLOR_PALETTE[co ? co.color : guessColor(x.id)];
                                                        return <span key={i} className={"text-[10px] font-bold px-1 rounded flex items-center " + th.bgLight + " " + th.text}><span className="opacity-70 mr-0.5">{x.p}</span>{x.id}</span>;
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ClassHistoryView = ({ data, classes }) => {
            const [selCls, setSelCls] = useState('ALL');
            const [search, setSearch] = useState("");
            
            const history = useMemo(() => {
                const list = [];
                Object.keys(data).sort().reverse().forEach(dk => {
                    Object.keys(data[dk] || {}).forEach(sid => {
                        const s = data[dk][sid];
                        if (!s || (!s.plan && !s.actual)) return;
                        if (selCls !== 'ALL' && s.classId !== selCls) return;
                        if (search && !((s.plan||'').includes(search) || (s.actual||'').includes(search))) return;
                        list.push({ date: dk, period: TIME_SLOTS.find(t=>t.id===sid)?.label||sid, plan: s.plan, actual: s.actual, classId: s.classId });
                    });
                });
                return list;
            }, [data, selCls, search]);

            return (
                <div className="bg-white rounded shadow p-4 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-4 border-b pb-4 gap-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Icons.List />記録検索</h2>
                        <div className="flex gap-2">
                            <div className="relative">
                                <Icons.Search className="absolute left-2 top-2.5 text-gray-400" />
                                <input type="text" className="pl-8 border p-2 rounded" placeholder="検索..." value={search} onChange={e=>setSearch(e.target.value)} />
                            </div>
                            <select className="border p-2 rounded" value={selCls} onChange={e=>setSelCls(e.target.value)}>
                                <option value="ALL">全クラス</option>
                                {classes.map((c,i) => <option key={i} value={c.name}>{c.name}</option>)}
                            </select>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto custom-scrollbar">
                        <table className="w-full text-left border-collapse text-sm">
                            <thead className="bg-gray-100 sticky top-0"><tr><th className="p-3 border-b w-24">日付</th><th className="p-3 border-b text-center w-20">クラス</th><th className="p-3 border-b w-1/2">予定</th><th className="p-3 border-b w-1/2">実施記録</th></tr></thead>
                            <tbody>
                                {history.map((h, i) => (
                                    <tr key={i} className="border-b hover:bg-gray-50">
                                        <td className="p-3 text-gray-600">{h.date}<br/><span className="text-xs bg-gray-200 px-1 rounded">{h.period}</span></td>
                                        <td className="p-3 font-bold text-center">{h.classId}</td>
                                        <td className="p-3 whitespace-pre-wrap">{h.plan}</td>
                                        <td className="p-3 whitespace-pre-wrap text-blue-800 font-medium">{h.actual}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const StatsView = ({ data, classes, date }) => {
            const [filter, setFilter] = useState('all');
            const counts = useMemo(() => {
                const c = {}; classes.forEach(i => c[i.name] = 0);
                const st = new Date(date), day = st.getDay(), df = st.getDate() - day + (day===0?-6:1);
                const mon = new Date(st.setDate(df)); mon.setHours(0,0,0,0);
                const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
                
                Object.entries(data).forEach(([dk, dd]) => {
                    const d = new Date(dk); if(isNaN(d.getTime())) return;
                    if(filter==='month' && (d.getMonth()!==date.getMonth() || d.getFullYear()!==date.getFullYear())) return;
                    if(filter==='week' && (d<mon || d>sun)) return;
                    Object.entries(dd || {}).forEach(([sid, s]) => { if(['1','2','3','4','5','6','7'].includes(sid) && s && s.classId) c[s.classId] = (c[s.classId]||0)+1; });
                });
                return c;
            }, [data, classes, filter, date]);

            const max = Math.max(...Object.values(counts), 1);

            return (
                <div className="bg-white rounded shadow p-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6 border-b pb-2">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Icons.BarChart />授業集計</h2>
                        <div className="flex bg-gray-100 p-1 rounded-lg">
                            {['all','month','week'].map(f => (
                                <button key={f} onClick={()=>setFilter(f)} className={"px-3 py-1 text-xs font-bold rounded " + (filter===f?"bg-white shadow text-blue-600":"text-gray-500 hover:text-gray-700")}>{f==='all'?'全期間':f==='month'?'今月':'今週'}</button>
                            ))}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 overflow-auto custom-scrollbar content-start">
                        {classes.map((cls, i) => {
                            const ct = counts[cls.name]||0;
                            const th = COLOR_PALETTE[cls.color]||COLOR_PALETTE.gray;
                            return (
                                <div key={i} className="border rounded p-4 bg-gray-50">
                                    <div className="flex justify-between items-baseline mb-2"><span className={"font-bold " + th.text}>{cls.name}</span><span className="text-xl font-bold">{ct} <span className="text-xs text-gray-500">コマ</span></span></div>
                                    <div className="w-full bg-gray-200 rounded-full h-2"><div className={th.bg + " h-2 rounded-full"} style={{width: (ct/max*100)+'%', minWidth:'5%'}}></div></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- Main App ---

        const App = () => {
            const [date, setDate] = useState(new Date()); 
            const [view, setView] = useState('week'); 
            const [data, setData] = useState({}); 
            const [classes, setClasses] = useState(DEFAULT_CLASSES);
            const [title, setTitle] = useState("担任");
            const [eventUrl, setEventUrl] = useState(''); // 行事予定表URLのステート
            const [appId, setAppId] = useState(initialAppId);
            const [syncId, setSyncId] = useState(() => localStorage.getItem('teacherLogSyncId') || generateId());
            const [isSyncing, setIsSyncing] = useState(false);
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, date: null, slotId: null });
            const [isSettingsOpen, setSettingsOpen] = useState(false);
            const [user, setUser] = useState(null);

            useEffect(() => {
                const loadSafe = (key, defaultVal, isArray) => {
                    const str = localStorage.getItem(key);
                    if (!str) return defaultVal;
                    try {
                        const parsed = JSON.parse(str);
                        if (isArray && Array.isArray(parsed)) return parsed;
                        if (!isArray && parsed && typeof parsed === 'object') return parsed;
                    } catch(e) {}
                    return defaultVal;
                };

                setData(loadSafe('teachersLogData', {}, false));
                setClasses(loadSafe('teachersLogClasses', DEFAULT_CLASSES, true));
                const sTit = localStorage.getItem('teacherLogTitle');
                if (sTit) setTitle(sTit);
                const sEvent = localStorage.getItem('teacherLogEventUrl');
                if (sEvent) setEventUrl(sEvent);
            }, []);

            useEffect(() => {
                if (!useCloud || !auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error("Auth error", e); }
                };
                initAuth();
                const unsub = auth.onAuthStateChanged(u => setUser(u));
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!useCloud || !db || !user) return;
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('weekly_plans').doc(syncId).onSnapshot(doc => {
                    if (doc.metadata.hasPendingWrites) return;
                    if (doc.exists) {
                        const d = doc.data();
                        if(d.schedule) setData(d.schedule); 
                        if(d.classes && Array.isArray(d.classes)) setClasses(d.classes); 
                        if(d.title) setTitle(d.title);
                        if(d.eventUrl !== undefined) setEventUrl(d.eventUrl);
                    }
                    setIsCloudLoaded(true);
                }, err => {
                    console.error("Firebase read error", err);
                });
                return () => unsub();
            }, [user, syncId, appId]);

            // 保存時に eventUrl も含める
            const saveCloud = useCallback(async (nd=data, nc=classes, nt=title, ne=eventUrl) => {
                if (!useCloud || !db || !user) return false;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('weekly_plans').doc(syncId).set({ schedule: nd||{}, classes: nc||[], title: nt||"", eventUrl: ne||"", updated: new Date().toISOString() }, { merge: true });
                    return true;
                } catch(e){ return false; }
            }, [user, syncId, appId, data, classes, title, eventUrl]);

            const triggerSync = async (tid, taid) => {
                if (!useCloud || !db || !user) return;
                setIsSyncing(true);
                try {
                    const doc = await db.collection('artifacts').doc(taid).collection('public').doc('data').collection('weekly_plans').doc(tid).get();
                    if (doc.exists) {
                        const d = doc.data();
                        if (confirm("クラウドデータを上書きロードしますか？")) {
                            if(d.schedule) setData(d.schedule); 
                            if(d.classes && Array.isArray(d.classes)) setClasses(d.classes); 
                            if(d.title) setTitle(d.title);
                            if(d.eventUrl !== undefined) setEventUrl(d.eventUrl);
                            alert("ロード完了");
                        }
                    } else {
                        if (confirm("クラウドにデータなし。現在のデータを登録しますか？")) { 
                            await saveCloud(); 
                            alert("登録完了"); 
                        }
                    }
                } catch(e) { alert("エラー: " + e.message); }
                setIsSyncing(false);
            };

            useEffect(() => { localStorage.setItem('teachersLogData', JSON.stringify(data)); }, [data]);
            useEffect(() => { localStorage.setItem('teachersLogClasses', JSON.stringify(classes)); }, [classes]);
            useEffect(() => { localStorage.setItem('teacherLogSyncId', syncId); localStorage.setItem('teacherLogAppId', appId); localStorage.setItem('teacherLogTitle', title); localStorage.setItem('teacherLogEventUrl', eventUrl); }, [syncId, appId, title, eventUrl]);

            const mon = getMonday(date);
            const wNum = Math.ceil(mon.getDate() / 7); 
            const wDates = WEEK_DAYS.map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
            
            const handleSaveSlot = (dk, sid, nd) => {
                const upd = { ...data, [dk]: { ...(data[dk]||{}), [sid]: nd } };
                setData(upd); if (isCloudLoaded) saveCloud(upd, classes, title, eventUrl);
            };

            const downloadBackup = () => {
                const a = document.createElement('a');
                // バックアップにも eventUrl を追加
                a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ schedule: data, classes: classes, title: title, eventUrl: eventUrl }));
                a.download = "backup_" + formatDateKey(new Date()) + ".json";
                a.click();
            };

            // ========== 年度リセットの処理 ==========
            const handleResetData = () => {
                const msg1 = "【警告】すべての予定と実施記録を消去します。\n\n※事前に「↓」ボタンからバックアップ（ダウンロード）を取りましたか？\nバックアップを取っていない場合は「キャンセル」を押してください。";
                if (window.confirm(msg1)) {
                    const msg2 = "本当にすべての記録を消去します。この操作は元に戻せません。\nよろしいですか？";
                    if (window.confirm(msg2)) {
                        setData({});
                        setEventUrl(''); // リセット時は行事予定表のURLもクリア
                        if (isCloudLoaded) saveCloud({}, classes, title, '');
                        alert("すべての記録を消去しました。新しい年度の準備が完了しました。");
                    }
                }
            };

            const uploadBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const fr = new FileReader(); 
                fr.readAsText(file, "UTF-8");
                fr.onload = ex => {
                    try {
                        const p = JSON.parse(ex.target.result);
                        if(p.schedule) setData(p.schedule); 
                        if(p.classes && Array.isArray(p.classes)) setClasses(p.classes); 
                        if(p.title) setTitle(p.title);
                        if(p.eventUrl !== undefined) setEventUrl(p.eventUrl);
                        if(isCloudLoaded) saveCloud(p.schedule, p.classes, p.title, p.eventUrl || '');
                        alert("データを安全に復元しました。");
                    } catch (error) {
                        alert("復元に失敗しました。ファイルが壊れている可能性があります。");
                    }
                };
                e.target.value = '';
            };

            const SlotCell = ({ dateKey, slot }) => {
                const sd = (data[dateKey] || {})[slot.id] || {};
                const co = classes.find(c => c.name === sd.classId);
                const th = COLOR_PALETTE[co ? co.color : guessColor(sd.classId)];
                
                let bg = 'bg-white';
                if (slot.id === 'lunch') bg = 'bg-gray-100 items-center justify-center text-gray-400';
                else if (slot.id === 'todo') bg = 'bg-red-50'; else if (slot.id === 'collection') bg = 'bg-blue-50'; else if (slot.id === 'morning') bg = 'bg-yellow-50'; else if (['after','memo'].includes(slot.id)) bg = 'bg-orange-50';
                
                return (
                    <div className={"border-b border-r border-gray-200 p-1 text-xs relative cursor-pointer hover:bg-blue-50 transition-colors group print-row overflow-hidden flex flex-col " + slot.height + " " + bg} onClick={() => setModal({isOpen:true, date:dateKey, slotId:slot.id})}>
                        {slot.type === 'class' && sd.classId && <span className={"font-bold mb-1 text-[10px] self-start px-1.5 py-0.5 rounded print-border " + th.bgLight + " " + th.text}>{sd.classId}</span>}
                        <div className="whitespace-pre-wrap leading-tight text-gray-700">{(!sd.plan && sd.actual) && <span className="text-orange-500 font-bold">[実] </span>}{sd.plan || sd.actual || ''}</div>
                    </div>
                );
            };

            return (
                <div className="h-screen flex flex-col print:h-auto">
                    <header className="bg-white border-b px-4 py-3 flex justify-between items-center shrink-0 no-print">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 text-white p-2 rounded shadow"><Icons.Calendar /></div>
                            <div>
                                <h1 className="text-xl font-bold leading-none hidden md:block">Teacher's Log Pro <span className="text-xs font-normal text-gray-400 bg-gray-100 px-1 border rounded">{APP_VERSION}</span></h1>
                                <p className="text-xs text-gray-500 mt-1">{title} {useCloud && <span className={"ml-2 " + (isCloudLoaded ? "text-green-500":"text-gray-400")}>●</span>}</p>
                            </div>
                        </div>
                        <div className="flex bg-gray-100 p-1 rounded-lg overflow-x-auto custom-scrollbar">
                            {/* 新しい「行事予定」タブを追加 */}
                            {[{id:'month',l:'月'},{id:'week',l:'週'},{id:'events',l:'行事予定'},{id:'history',l:'履歴'},{id:'stats',l:'集計'}].map(m => (
                                <button key={m.id} onClick={()=>setView(m.id)} className={"px-2 md:px-4 py-1.5 text-xs md:text-sm font-bold rounded transition whitespace-nowrap " + (view===m.id ? "bg-white shadow text-blue-600":"text-gray-500 hover:text-gray-800")}>{m.l}</button>
                            ))}
                        </div>
                        <div className="flex gap-1 ml-2">
                            <button onClick={()=>window.print()} className="p-2 text-gray-500 hover:bg-gray-100 rounded" title="印刷"><Icons.Printer/></button>
                            <label className="p-2 text-gray-500 hover:bg-gray-100 rounded cursor-pointer" title="バックアップの読み込み"><Icons.Upload/><input type="file" onChange={uploadBackup} className="hidden" accept=".json"/></label>
                            <button onClick={downloadBackup} className="p-2 text-gray-500 hover:bg-gray-100 rounded" title="バックアップの保存"><Icons.Download/></button>
                            <button onClick={()=>setSettingsOpen(true)} className="p-2 text-gray-500 hover:bg-gray-100 rounded relative" title="設定"><Icons.Settings/>{!isCloudLoaded&&useCloud&&<span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}</button>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col overflow-hidden print:overflow-visible">
                        {/* 行事予定タブ以外のときに日付コントロールを表示 */}
                        {view !== 'events' && (
                            <div className="bg-white border-b px-6 py-2 flex justify-between items-center shrink-0 no-print">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => { const nd=new Date(date); view==='month'?nd.setMonth(nd.getMonth()-1):nd.setDate(nd.getDate()-7); setDate(nd); }} className="p-1 hover:bg-gray-100 rounded-full"><Icons.ChevronLeft/></button>
                                    <h2 className="text-xl font-bold font-mono text-gray-800">{date.getFullYear()}年 {date.getMonth() + 1}月 {view==='week' && <span className="text-base text-gray-400 ml-2">第{wNum}週</span>}</h2>
                                    <button onClick={() => { const nd=new Date(date); view==='month'?nd.setMonth(nd.getMonth()+1):nd.setDate(nd.getDate()+7); setDate(nd); }} className="p-1 hover:bg-gray-100 rounded-full"><Icons.ChevronRight/></button>
                                    <button onClick={()=>{setDate(new Date()); setView('week');}} className="text-xs bg-gray-200 px-2 py-1 rounded font-bold">今日</button>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-hidden print:overflow-visible">
                            {view === 'week' && (
                                <div className="h-full overflow-auto custom-scrollbar p-4 print:p-0 print:overflow-visible">
                                    <div className="bg-white shadow rounded border min-w-[800px] print:shadow-none print:min-w-0 print:border-black">
                                        <div className="grid grid-cols-[80px_repeat(6,1fr)] bg-gray-50 border-b print:bg-white print:border-black">
                                            <div className="p-3 text-center text-xs font-bold text-gray-500 border-r">時限</div>
                                            {wDates.map((d, i) => {
                                                const isT = d.toDateString() === new Date().toDateString();
                                                return (
                                                    <div key={i} className={"p-2 text-center border-r last:border-r-0 " + (isT?"bg-blue-50":"")}>
                                                        <div className="text-xs text-gray-500">{WEEK_DAYS[i]}</div>
                                                        <div className={"text-lg font-bold " + (i===5?"text-blue-600":"text-gray-800")}>{d.getDate()}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        {TIME_SLOTS.map(slot => {
                                            let lb = 'bg-gray-50';
                                            if(slot.id==='lunch') lb='bg-gray-100'; else if(['todo','collection','morning'].includes(slot.id)) lb='bg-yellow-100'; else if(['after','memo'].includes(slot.id)) lb='bg-orange-100';
                                            return (
                                                <div key={slot.id} className="grid grid-cols-[80px_repeat(6,1fr)] hover:bg-gray-50 print-row">
                                                    <div className={"border-b border-r flex items-center justify-center text-xs font-bold text-gray-600 " + lb}>{slot.label}</div>
                                                    {wDates.map((d, i) => <div key={i} className="print-border"><SlotCell dateKey={formatDateKey(d)} slot={slot} /></div>)}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            {view === 'month' && <MonthView date={date} data={data} onNav={d=>{setDate(d);setView('week');}} classes={classes} />}
                            
                            {/* 追加された「行事予定表」タブの中身 */}
                            {view === 'events' && (
                                <div className="h-full p-4 flex flex-col">
                                    <div className="bg-white rounded-lg shadow border flex-1 flex flex-col overflow-hidden">
                                        <div className="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                                            <h2 className="text-lg font-bold flex items-center gap-2"><Icons.FileText /> 行事予定表</h2>
                                            {eventUrl && (
                                                <button 
                                                    onClick={() => { setEventUrl(''); if(isCloudLoaded) saveCloud(data, classes, title, ''); }} 
                                                    className="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded font-bold hover:bg-red-200 transition-colors"
                                                >
                                                    URLを解除
                                                </button>
                                            )}
                                        </div>
                                        <div className="flex-1 bg-gray-200 relative">
                                            {eventUrl ? (
                                                <iframe src={eventUrl} className="w-full h-full border-0" title="Event Schedule"></iframe>
                                            ) : (
                                                <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-600 p-6 text-center overflow-y-auto custom-scrollbar">
                                                    <Icons.FileText size={64} className="mb-4 opacity-30" />
                                                    <h3 className="text-lg font-bold mb-2">行事予定表（PDF等）のリンクを設定</h3>
                                                    <p className="text-sm mb-6 max-w-md">
                                                        複数端末で予定表を同期して確認できるように、<br/>
                                                        学校HPのリンクや、<b>GoogleドライブにアップロードしたPDFの共有リンク</b>を貼り付けてください。
                                                    </p>
                                                    <div className="flex w-full max-w-lg gap-2 mb-6">
                                                        <input 
                                                            type="url" 
                                                            placeholder="https://drive.google.com/file/d/..." 
                                                            className="flex-1 border p-2 rounded shadow-sm"
                                                            id="eventUrlInput"
                                                        />
                                                        <button 
                                                            onClick={() => {
                                                                const val = document.getElementById('eventUrlInput').value;
                                                                if(val) {
                                                                    // Googleドライブのリンクを自動でプレビュー用に変換する処理
                                                                    let finalUrl = val;
                                                                    if (finalUrl.includes('drive.google.com/file/d/')) {
                                                                        finalUrl = finalUrl.replace('/view?usp=sharing', '/preview').replace('/view', '/preview');
                                                                    }
                                                                    setEventUrl(finalUrl);
                                                                    if (isCloudLoaded) saveCloud(data, classes, title, finalUrl);
                                                                }
                                                            }}
                                                            className="bg-blue-600 text-white font-bold px-4 py-2 rounded shadow hover:bg-blue-700 whitespace-nowrap transition-colors"
                                                        >
                                                            保存して表示
                                                        </button>
                                                    </div>
                                                    <div className="text-xs text-gray-500 text-left bg-white p-4 rounded shadow-sm border border-gray-200 max-w-lg w-full">
                                                        <p className="font-bold text-gray-700 mb-1">【GoogleドライブのPDFを貼る場合の手順】</p>
                                                        <ol className="list-decimal pl-4 space-y-1">
                                                            <li>予定表のPDFをGoogleドライブに保存する</li>
                                                            <li>ファイルを右クリック ＞ 「共有」</li>
                                                            <li>一般的なアクセスを「<b>リンクを知っている全員</b>」に変更</li>
                                                            <li>「リンクをコピー」して、上の枠に貼り付ける</li>
                                                        </ol>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'history' && <div className="h-full p-4"><ClassHistoryView data={data} classes={classes} /></div>}
                            {view === 'stats' && <div className="h-full p-4"><StatsView data={data} classes={classes} date={date} /></div>}
                        </div>
                    </main>

                    <SlotModal isOpen={modal.isOpen} onClose={()=>setModal({...modal, isOpen:false})} date={modal.date} slotId={modal.slotId} data={(data[modal.date]||{})[modal.slotId]} onSave={handleSaveSlot} classOptions={classes} />
                    <SettingsModal isOpen={isSettingsOpen} onClose={()=>setSettingsOpen(false)} classes={classes} onUpdateClasses={c=>{setClasses(c); if(isCloudLoaded)saveCloud(data,c,title,eventUrl);}} syncId={syncId} onUpdateSyncId={setSyncId} appId={appId} onUpdateAppId={setAppId} onTriggerSync={triggerSync} isSyncing={isSyncing} title={title} onUpdateTitle={t=>{setTitle(t); if(isCloudLoaded)saveCloud(data,classes,t,eventUrl);}} onResetData={handleResetData} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
